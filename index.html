<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Web-Ready Access Hub | Coming Soon</title>
		<meta
			name="description"
			content="Web-Ready Access Hub — empowering nonprofits with accessible web tools, sustainability practices, and in-kind tech grants. Coming soon."
		/>
		<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon/android-chrome-192x192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="assets/favicon/android-chrome-512x512.png" />
		<link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Work+Sans:wght@300;400;500;600&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			html, body {
				height: 100%;
				overflow: hidden;
			}

			body {
				font-family: "Work Sans", "Segoe UI", sans-serif;
				background: #ff6b35;
				color: #ffffff;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				padding: 0 8vw;
			}

			.content {
				max-width: 700px;
				flex: 1;
				display: flex;
				flex-direction: column;
				justify-content: center;
				padding-bottom: 10vh;
			}

			.headline {
				font-family: "Fredoka", sans-serif;
				font-weight: 700;
				font-size: clamp(2.6rem, 9vw, 6.5rem);
				line-height: 1.05;
				letter-spacing: -0.02em;
				color: #ffffff;
				margin-bottom: 20px;
			}

			.tagline {
				font-size: clamp(0.95rem, 2.2vw, 1.2rem);
				line-height: 1.7;
				color: rgba(255, 255, 255, 0.85);
				font-weight: 400;
				max-width: 480px;
			}

			.supported {
				padding: 32px 0;
				display: flex;
				align-items: center;
				gap: 20px;
				flex-shrink: 0;
			}

			.supported span {
				font-size: 0.85rem;
				font-weight: 500;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				color: rgba(255, 255, 255, 0.55);
				white-space: nowrap;
			}

			.logo-pill {
				display: inline-flex;
				align-items: center;
				padding: 8px 18px;
				background: rgba(255, 255, 255, 0.15);
				border-radius: 12px;
				backdrop-filter: blur(4px);
				-webkit-backdrop-filter: blur(4px);
			}

			.logo-pill img {
				height: 36px;
				width: auto;
				object-fit: contain;
				filter: brightness(0) invert(1);
			}

			@media (max-width: 768px) {
				body {
					padding: 0 7vw;
				}

				.headline {
					font-size: clamp(2.2rem, 11vw, 3.5rem);
					margin-bottom: 16px;
				}

				.tagline {
					font-size: 0.95rem;
				}

				.supported {
					padding: 20px 0;
					gap: 10px;
					flex-wrap: wrap;
				}

				.logo-pill {
					padding: 6px 14px;
				}

				.logo-pill img {
					height: 28px;
				}
			}

			@media (max-width: 380px) {
				.headline {
					font-size: 2rem;
				}

				.supported {
					gap: 8px;
				}

				.logo-pill img {
					height: 22px;
				}
			}

			@media (max-height: 500px) {
				.headline {
					font-size: clamp(1.8rem, 6vw, 3rem);
					margin-bottom: 12px;
				}

				.supported {
					padding: 12px 0;
				}
			}
		</style>
	</head>
	<body>
		<div class="content">
			<h1 class="headline">The nonprofit web playbook, almost ready.</h1>
			<p class="tagline">
				The Web-Ready Access Hub is a youth-led resource helping nonprofits
				build accessible websites, adopt sustainable design, and
				tap into $100,000s in free tech grants. We're putting the
				finishing touches on it now.
			</p>
		</div>

		<div class="supported">
			<span>Supported by</span>
			<div class="logo-pill">
				<img src="assets/GLOCAL-Foundation.avif" alt="GLOCAL Foundation" />
			</div>
			<div class="logo-pill">
				<img src="assets/Government_Canada.avif" alt="Government of Canada" />
			</div>
		</div>
	</body>
</html>

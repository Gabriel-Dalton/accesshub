<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Access Hub | Coming Soon</title>
		<meta
			name="description"
			content="Access Hub — empowering nonprofits with accessible web tools, sustainability practices, and in-kind tech grants. Coming soon."
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Work+Sans:wght@300;400;500;600&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			html, body {
				height: 100%;
				overflow: hidden;
			}

			body {
				font-family: "Work Sans", "Segoe UI", sans-serif;
				background: #ff6b35;
				color: #ffffff;
				display: flex;
				flex-direction: column;
				justify-content: center;
				padding: 60px 8vw;
			}

			.content {
				max-width: 640px;
			}

			.headline {
				font-family: "Fredoka", sans-serif;
				font-weight: 700;
				font-size: clamp(3.2rem, 9vw, 6.5rem);
				line-height: 1.05;
				letter-spacing: -0.02em;
				color: #ffffff;
				margin-bottom: 24px;
			}

			.tagline {
				font-size: clamp(1rem, 2.2vw, 1.2rem);
				line-height: 1.7;
				color: rgba(255, 255, 255, 0.85);
				font-weight: 400;
				max-width: 480px;
			}

			.supported {
				position: fixed;
				bottom: 32px;
				left: 8vw;
				display: flex;
				align-items: center;
				gap: 20px;
			}

			.supported span {
				font-size: 0.8rem;
				font-weight: 500;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				color: rgba(255, 255, 255, 0.6);
			}

			.supported img {
				height: 36px;
				width: auto;
				object-fit: contain;
				mix-blend-mode: multiply;
			}

			@media (max-width: 600px) {
				body {
					padding: 48px 7vw;
				}

				.supported {
					bottom: 24px;
					left: 7vw;
					gap: 14px;
				}

				.supported img {
					height: 28px;
				}
			}
		</style>
	</head>
	<body>
		<div class="content">
			<h1 class="headline">Something cool is coming.</h1>
			<p class="tagline">
				We're building the go-to resource for nonprofits to unlock
				accessible web tools, sustainable design, and thousands in
				free technology grants.
			</p>
		</div>

		<div class="supported">
			<span>Supported by</span>
			<img src="assets/GLOCAL-Foundation.webp" alt="GLOCAL Foundation" />
			<img src="assets/Government_Canada.png" alt="Government of Canada" />
		</div>
	</body>
</html>
